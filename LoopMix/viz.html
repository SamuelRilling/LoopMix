<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoopMix Key Map</title>
<style>
:root {
  --bg: #0e0f12; --panel: #17191e; --line: #2a2d35; --text: #e9e6df; --dim: #8a8d96;
  --loop: #49d6c4; --break: #f2a93b; --fx: #e0559b; --play: #9b8cff; --stop: #ef5b4c; --sync: #f4e04d;
  --white-key: #ece8de; --white-text: #1b1c20; --black-key: #23252b;
  --font: "Bahnschrift", "DIN Alternate", "Segoe UI Variable Display", system-ui, sans-serif;
  --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
main { max-width: 1400px; margin: 0 auto; padding: 20px 16px 32px; }
header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 15px; letter-spacing: .32em; font-weight: 600; color: var(--dim); }
.pill { font-size: 13px; letter-spacing: .14em; padding: 4px 10px; border-radius: 3px; font-weight: 700; }
.pill.loop { background: var(--loop); color: #06201d; }
.pill.play { background: var(--play); color: #140f33; }
.pill.sync { background: transparent; color: var(--dim); border: 1px solid var(--line); }
.pill.sync.on { background: var(--sync); color: #26220a; border-color: var(--sync); }
.meta { font-family: var(--mono); font-size: 13px; color: var(--dim); margin-left: auto; }
.meta b { color: var(--text); font-weight: 500; }

/* Global beat marker */
.clock { display: grid; grid-template-columns: auto auto 1fr; gap: 20px; align-items: center;
  margin-top: 18px; padding: 12px 16px; background: var(--panel); }
.bb { font-family: var(--mono); font-size: clamp(28px, 4vw, 44px); font-weight: 700; letter-spacing: .02em;
  min-width: 4.2ch; font-variant-numeric: tabular-nums; }
.beats { display: flex; gap: 8px; }
.beats i { width: 22px; height: 22px; border-radius: 50%; background: var(--line); transition: background .05s; }
.beats i.on { background: var(--text); }
.beats i.one.on { background: var(--loop); box-shadow: 0 0 14px rgba(73, 214, 196, .6); }
.phrase { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.phrase small { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.phrase small b { color: var(--sync); font-weight: 600; }
.cells { display: flex; gap: 2px; height: 14px; }
.cells i { flex: 1; background: var(--line); }
.cells i.bar { margin-left: 5px; }
.cells i.done { background: #3c5e5a; }
.cells i.now { background: var(--loop); }
.cells.sync i.now { background: var(--sync); }

.ladder { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; margin: 18px 0 6px; }
.step { padding: 10px 12px 12px; background: var(--panel); border-top: 3px solid var(--line); }
.step small { display: block; font-family: var(--mono); font-size: 11px; color: var(--dim); }
.step span { font-size: clamp(16px, 2vw, 24px); font-weight: 600; }
.step.on { border-top-color: var(--loop); background: #1c2a2a; }
.hint { font-size: 12px; color: var(--dim); margin: 0 0 18px; }

/* Parts with beat rings */
.parts { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 4px; }
.part { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center;
  padding: 10px 12px; background: var(--panel); border-left: 3px solid transparent; min-width: 0; }
.part.sel { border-left-color: var(--loop); background: #1c2125; }
.part > div { min-width: 0; }
.part small { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.part .name { font-size: 17px; font-weight: 600; }
.part p { margin: 4px 0 0; font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.part p.on { color: var(--loop); }
.part p.wait { color: var(--sync); }
.part p.none { font-style: italic; }
.ring { width: 64px; height: 64px; }
.ring .seg { fill: none; stroke: var(--line); stroke-width: 7; }
.ring .seg.bar1 { stroke: #3a3f4a; }
.ring .seg.done { stroke: #2f6b64; }
.ring .seg.now { stroke: var(--loop); }
.ring .seg.wait { stroke: var(--sync); opacity: .35; }
.ring text { font-family: var(--mono); font-size: 15px; font-weight: 700; fill: var(--text); text-anchor: middle; }
.ring text.sub { font-size: 9px; font-weight: 400; fill: var(--dim); }

.kb-wrap { position: relative; margin-top: 22px; overflow-x: auto; }
.kb { position: relative; height: 300px; min-width: 900px; }
.white, .black { position: absolute; top: 0; border-radius: 0 0 6px 6px; transition: box-shadow .15s, transform .15s; }
.white { height: 100%; background: var(--white-key); color: var(--white-text); border: 1px solid #b9b4a8; }
.white .label { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%) rotate(180deg);
  writing-mode: vertical-rl; font-size: 14px; font-weight: 600; white-space: nowrap; max-height: 150px; overflow: hidden; }
.white .note, .black .note { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center;
  font-family: var(--mono); font-size: 10px; opacity: .55; }
.white.stop { background: #f4d6d1; }
.white.stop .label { color: var(--stop); letter-spacing: .2em; }
.white.idle { background: #c9c5bc; }
.white.on { box-shadow: inset 0 -8px 0 var(--loop), 0 0 24px rgba(73, 214, 196, .45); }
.white.wait { box-shadow: inset 0 -8px 0 var(--sync); }
.black { height: 58%; background: var(--black-key); color: var(--text); z-index: 2; border: 1px solid #000;
  border-top: 0; display: flex; flex-direction: column; align-items: center; padding-top: 10px; }
.black .num { font-family: var(--mono); font-size: 15px; font-weight: 700; }
.black.break { border-bottom: 5px solid var(--break); }
.black.break .num { color: var(--break); }
.black.fx { border-bottom: 5px solid var(--fx); }
.black.fx .num { color: var(--fx); }
.black.on { transform: translateY(2px); box-shadow: 0 0 22px currentColor; }
.black.empty { opacity: .35; }

.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 14px; }
.legend section { background: var(--panel); padding: 12px 14px; }
.legend h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .2em; font-weight: 600; }
.legend .break h2 { color: var(--break); }
.legend .fx h2 { color: var(--fx); }
.legend ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.legend li { font-size: 14px; display: flex; gap: 10px; }
.legend li span { font-family: var(--mono); color: var(--dim); min-width: 28px; }
.legend li.on { color: var(--text); font-weight: 600; }

.veil { position: absolute; inset: 0; display: none; place-items: center; background: rgba(14, 15, 18, .78);
  z-index: 3; font-size: clamp(18px, 3vw, 32px); letter-spacing: .12em; color: var(--play); text-align: center; }
.play-mode .veil { display: grid; }
.offline { position: fixed; inset: auto 16px 16px auto; background: var(--stop); color: #fff; padding: 8px 12px;
  font-size: 13px; display: none; }
.is-offline .offline { display: block; }
@media (max-width: 900px) {
  .parts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .clock { grid-template-columns: auto 1fr; }
  .phrase { grid-column: 1 / -1; }
}
@media (max-width: 700px) {
  .legend { grid-template-columns: 1fr; }
  .meta { margin-left: 0; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>LOOPMIX</h1>
    <span id="mode" class="pill loop">LOOP</span>
    <span id="sync" class="pill sync" title="B8: phrase sync">SYNC OFF</span>
    <span class="meta"><b id="tempo">–</b> BPM · <b id="transport">stopped</b></span>
  </header>
  <section class="clock" aria-label="Song position">
    <div class="bb" id="bb">1.1</div>
    <div class="beats" id="beats"></div>
    <div class="phrase">
      <small id="phrase-label">Phrase</small>
      <div class="cells" id="cells"></div>
    </div>
  </section>
  <div id="ladder" class="ladder" aria-label="Sections"></div>
  <p class="hint">Octave ◄ ► change section · B8 phrase sync: loops wait for the phrase's first beat</p>
  <div id="parts" class="parts" aria-label="Parts, buttons B2 to B7"></div>
  <div class="kb-wrap">
    <div id="kb" class="kb" aria-label="Keyboard map"></div>
    <div class="veil"><div>PLAY MODE<br><small id="oct"></small></div></div>
  </div>
  <div class="legend">
    <section class="break"><h2>BREAKS · LOWER BLACK KEYS</h2><ol id="breaks"></ol></section>
    <section class="fx"><h2>FX ON TOP · UPPER BLACK KEYS</h2><ol id="fxs"></ol></section>
  </div>
</main>
<div class="offline">Waiting for Live…</div>
<script>
const NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const BLACK = [1, 3, 6, 8, 10];
const SVG = "http://www.w3.org/2000/svg";
const noteName = k => NAMES[k % 12] + (3 + Math.floor(k / 12));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const svg = (tag, attrs) => { const e = document.createElementNS(SVG, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

let state = null, received = 0, rings = [], phraseCells = [], beatDots = [];

/* Beats elapsed since Live took the snapshot (its age when served + time since we got it),
   so the page stays in time and moves smoothly between updates. */
const drift = () => state && state.is_playing
  ? ((performance.now() - received) / 1000 + (state.age || 0)) / 60 * state.tempo : 0;
const mod = (a, n) => ((a % n) + n) % n;

function arc(cx, cy, r, a0, a1) {
  const p = a => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

/* A ring with one segment per beat of the loop, like Live's clip pie. */
function ring(part, bar) {
  const box = svg("svg", { viewBox: "0 0 64 64", class: "ring", "aria-hidden": "true" });
  const beats = Math.max(1, Math.round(part.length || 0));
  const gap = beats > 16 ? 0.03 : 0.07;
  const segs = [];
  if (part.length) {
    for (let b = 0; b < beats; b++) {
      const a0 = b / beats * 2 * Math.PI + gap, a1 = (b + 1) / beats * 2 * Math.PI - gap;
      const seg = svg("path", { d: arc(32, 32, 26, a0, a1), class: "seg" + (b % bar === 0 ? " bar1" : "") });
      box.append(seg); segs.push(seg);
    }
  } else {
    box.append(svg("circle", { cx: 32, cy: 32, r: 26, class: "seg" + (part.pending ? " wait" : "") }));
  }
  const big = svg("text", { x: 32, y: 35 }), sub = svg("text", { x: 32, y: 47, class: "sub" });
  box.append(big, sub);
  return { box, segs, big, sub, part };
}

function tickRing(r, i) {
  const p = state.parts[i];  // latest snapshot; the ring's shape only changes on rebuild
  if (p.length && p.position != null) {
    const pos = mod(p.position + drift(), p.length);
    const now = Math.floor(pos);
    r.segs.forEach((s, b) => { s.classList.toggle("done", b < now); s.classList.toggle("now", b === now); });
    r.big.textContent = now + 1;
    r.sub.textContent = "/" + Math.round(p.length);
  } else if (p.pending && state.pending_start != null) {
    const left = Math.max(0, Math.ceil(state.pending_start - (state.song_time + drift())));
    r.big.textContent = left; r.sub.textContent = "to go";
  } else {
    r.big.textContent = "–"; r.sub.textContent = "";
  }
}

function clock() {
  const s = state, bar = s.bar || 4;
  const t = s.song_time + drift();
  const beatInBar = Math.floor(mod(t, bar));
  document.getElementById("bb").textContent = (Math.floor(t / bar) + 1) + "." + (beatInBar + 1);
  beatDots.forEach((d, i) => d.classList.toggle("on", i === beatInBar));
  const phrase = Math.max(bar, s.phrase_beats || bar);
  const inPhrase = Math.floor(mod(t, phrase));
  phraseCells.forEach((c, i) => { c.classList.toggle("done", i < inPhrase); c.classList.toggle("now", i === inPhrase); });
  const label = document.getElementById("phrase-label");
  const waiting = s.pending_start != null ? Math.max(0, Math.ceil(s.pending_start - t)) : null;
  label.innerHTML = `Phrase · beat ${inPhrase + 1}/${Math.round(phrase)}` +
    (waiting != null ? ` · <b>queued loops start in ${waiting}</b>` : "");
}

function keyboard(s) {
  const kb = document.getElementById("kb");
  kb.replaceChildren();
  const byKey = new Map(s.keys.map(k => [k.key, k]));
  const selected = s.parts.find(p => p.selected);
  const whites = [];
  for (let k = 0; k <= 24; k++) if (!BLACK.includes(k % 12)) whites.push(k);
  const w = 100 / whites.length;
  whites.forEach((k, i) => {
    const info = byKey.get(k);
    const key = el("div", "white");
    key.style.left = (i * w) + "%"; key.style.width = w + "%";
    let label = info ? info.label : "";
    if (k === 0) { key.classList.add("stop"); label = "STOP"; }
    if (k === 24 || (info && !info.label)) key.classList.add("idle");
    if (info && info.playing) key.classList.add("on");
    if (info && selected && selected.pending && info.label === selected.pending) key.classList.add("wait");
    key.append(el("div", "label", label), el("div", "note", noteName(k)));
    key.title = noteName(k) + (label ? " · " + label : "");
    kb.append(key);
    if (BLACK.includes((k + 1) % 12) && k + 1 < 24) {
      const b = byKey.get(k + 1);
      const black = el("div", "black " + (b ? b.kind : ""));
      black.style.left = ((i + 1) * w - w * 0.3) + "%"; black.style.width = (w * 0.6) + "%";
      const idx = b ? (b.kind === "break" ? [1, 3, 6, 8, 10] : [13, 15, 18, 20, 22]).indexOf(k + 1) + 1 : "";
      black.append(el("div", "num", idx), el("div", "note", noteName(k + 1)));
      if (b && b.playing) black.classList.add("on");
      if (b && !b.label) black.classList.add("empty");
      black.title = noteName(k + 1) + (b && b.label ? " · " + b.label : "");
      kb.append(black);
    }
  });
}

function legend(id, keys) {
  document.getElementById(id).replaceChildren(...keys.map((k, i) => {
    const li = el("li", k.playing ? "on" : "");
    li.append(el("span", "", noteName(k.key)), document.createTextNode((i + 1) + " · " + (k.label || "—")));
    return li;
  }));
}

function render(s) {
  document.body.classList.remove("is-offline");
  document.body.classList.toggle("play-mode", s.mode === "play");
  const mode = document.getElementById("mode");
  mode.textContent = s.mode.toUpperCase(); mode.className = "pill " + s.mode;
  const sync = document.getElementById("sync");
  sync.textContent = s.phrase ? "SYNC " + Math.round(s.phrase_beats) : "SYNC OFF";
  sync.classList.toggle("on", s.phrase);
  document.getElementById("tempo").textContent = Math.round(s.tempo * 10) / 10;
  document.getElementById("transport").textContent = s.is_playing ? "playing" : "stopped";
  document.getElementById("oct").textContent = "octave " + (s.octave > 0 ? "+" : "") + s.octave;

  const bar = Math.round(s.bar || 4);
  beatDots = Array.from({ length: bar }, (_, i) => el("i", i === 0 ? "one" : ""));
  document.getElementById("beats").replaceChildren(...beatDots);
  const phrase = Math.max(bar, Math.round(s.phrase_beats || bar));
  phraseCells = Array.from({ length: phrase }, (_, i) => el("i", i > 0 && i % bar === 0 ? "bar" : ""));
  const cells = document.getElementById("cells");
  cells.replaceChildren(...phraseCells);
  cells.classList.toggle("sync", s.phrase);

  document.getElementById("ladder").replaceChildren(...s.sections.map((name, i) => {
    const step = el("div", "step" + (i === s.section ? " on" : ""));
    step.append(el("small", "", "S" + (i + 1)), el("span", "", name));
    return step;
  }));
  rings = [];
  document.getElementById("parts").style.setProperty("--n", Math.max(s.parts.length, 1));
  document.getElementById("parts").replaceChildren(...s.parts.map((p, i) => {
    const part = el("div", "part" + (p.selected ? " sel" : ""));
    const r = ring(p, bar); rings.push(r);
    const text = el("div");
    let line;
    if (p.pending) line = el("p", "wait", "Queued: " + p.pending);
    else if (p.playing) line = el("p", "on", p.playing);
    else line = el("p", "none", "Nothing playing");
    text.append(el("small", "", "B" + (i + 2)), el("div", "name", p.name), line);
    part.append(r.box, text);
    return part;
  }));
  keyboard(s);
  legend("breaks", s.keys.filter(k => k.kind === "break"));
  legend("fxs", s.keys.filter(k => k.kind === "fx"));
}

function frame() {
  if (state) { clock(); rings.forEach(tickRing); }
  requestAnimationFrame(frame);
}

let lastStructure = "";
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    const s = await r.json();
    if (s.keys) {
      state = s; received = performance.now();
      /* Rebuild the DOM only when something other than the moving positions changed. */
      const structure = JSON.stringify(s, (k, v) => ["song_time", "position", "age"].includes(k) ? undefined : v);
      if (structure !== lastStructure) { lastStructure = structure; render(s); }
    }
  } catch (e) {
    document.body.classList.add("is-offline");
  }
  setTimeout(poll, 150);
}
requestAnimationFrame(frame);
poll();
</script>
</body>
</html>
